                                - content_display
                                - cnt
                                - icon
                          required:
                          - start
                          - end
                          - title
                          - title_display
                          - list
                      title_field:
                        type: string
                    required:
                    - index
                    - total
                    - search_total
                    - results
                    - title_field
                required:
                - code
                - msg
                - data
