                              Windows:
                                type: object
                                properties:
                                  engine_url:
                                    type: string
                                  engine_md5:
                                    type: string
                                required:
                                - engine_url
                                - engine_md5
                            required:
                            - Linux
                            - UOS
                            - macOS
                            - Kylin
                            - Windows
                          model:
                            type: object
                            properties:
                              arm64:
                                type: object
                                properties:
