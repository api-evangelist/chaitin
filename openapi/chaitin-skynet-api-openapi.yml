openapi: 3.2.0
info:
  description: mgt API swagger document.
  title: mgt Skynet API
  contact: {}
  version: '2.0'
servers:
- url: /api
tags:
- name: skynet
paths:
  /open/skynet/rule:
    get:
      tags:
      - skynet
      summary: get enhance rule
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response.JSONBody'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/api.GetSkynetRuleRes'
      x-cli-summary: 获取加强规则列表
      operationId: getOpenSkynetRule
      x-operation-id-source: derived
    put:
      tags:
      - skynet
      summary: update enhance rule
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.JSONBody'
      x-cli-summary: 更新加强规则
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.PutSkynetRuleReq'
        description: request params
        required: true
      operationId: putOpenSkynetRule
      x-operation-id-source: derived
components:
  schemas:
    detect.SkynetInfo:
      type: object
      properties:
        attack_type:
          type: integer
        attack_type_name:
          type: string
        id:
          type: string
        mode:
          $ref: '#/components/schemas/detect.Mode'
        name:
          type: string
        risk_level:
          type: integer
    api.PutSkynetRuleReq:
      type: object
      properties:
        global:
          type: boolean
        id:
          type: array
          items:
            type: string
        mode:
          $ref: '#/components/schemas/detect.Mode'
    api.GetSkynetRuleRes:
      type: object
      properties:
        rules:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/detect.SkynetInfo'
    detect.Mode:
      type: string
      enum:
      - strict
      - default
      - dry_run
      - disable
      - deny
      x-enum-varnames:
      - StrictMode
      - DefaultMode
      - DryRunMode
      - DisableMode
      - DenyMode
    response.JSONBody:
      type: object
      properties:
        data: {}
        err:
          type: string
        msg:
          type: string
x-cli:
  tags:
    site: 防护站点管理
    cert: 授权与证书管理
    log: 日志查询
    stat: 数据统计
    skynet: 加强规则管理
    module: 语义分析模块配置
    rule: 自定义规则管理
    ipgroup: IP 黑白名单管理
  children:
    log/attack: 攻击日志
    log/audit: 审计日志
    log/rule: 黑白名单检测日志
    stat/trend: 趋势统计
  params:
    server_names: 域名（多个用逗号分隔）
    ports: 端口（多个用逗号分隔）
    upstreams: 后端地址（多个用逗号分隔）
    cert_id: 证书 ID
    comment: 备注说明
    email: 管理员邮箱
    group_id: 分组 ID
    health_check: 是否启用健康检查
    id: 资源 ID
    ids: 资源 ID（多个用逗号分隔）
    site: 站点域名
    sp_enabled: 是否启用语义分析
    stat_enabled: 是否启用统计
    load_balance: 负载均衡策略
    name: 规则名称
    pattern: 匹配规则（JSON 格式）
    action: 动作类型：0-放行 1-阻断 2-挑战 3-认证防护 4-混淆 5-等待室
    level: 风险等级
    enable: 是否启用
    mode: 模式：strict/default/dry_run/disable/deny
    semantics: 语义分析配置
    use_global: 是否使用全局配置
    ips: IP 地址（多个用逗号分隔）
    ip_group_ids: IP Group ID（多个用逗号分隔）
    page: 页码
    page_size: 每页数量
    size: 每页数量
    start: 开始时间戳（秒）
    end: 结束时间戳（秒）
    begin_time: 开始时间戳（秒）
    end_time: 结束时间戳（秒）
    site_id: 站点 ID
    host: 域名
    ip: IP 地址
    url: URL 路径
    port: 端口
    attack_type: 攻击类型
    event_id: 事件 ID
    ja4_fingerprint: JA4 指纹
    top: 返回前 N 条
    reference: 引用来源
    expire: 过期时间
    log: 是否记录日志
    is_enabled: 是否启用
    global: 是否全局
