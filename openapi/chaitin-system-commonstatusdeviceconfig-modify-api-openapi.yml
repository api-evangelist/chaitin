openapi: 3.0.3
info:
  title: APISec Management account system/commonstatusdeviceconfig/modify API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: system/commonstatusdeviceconfig/modify
  description: 系统配置/常用状态设备配置/修改
paths:
  /system/commonstatusdeviceconfig/modify:
    post:
      summary: 终端配置 - 浏览器深度管控
      deprecated: false
      description: ''
      tags:
      - system/commonstatusdeviceconfig/modify
      parameters:
      - name: X-CS-Header-App
        in: header
        description: 应用id
        required: true
        example: '{{app}}'
        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                browser_depth_control_options:
                  type: object
                  properties:
                    extension_options:
                      type: object
                      properties:
                        edge:
                          type: object
                          properties:
                            ext_id:
                              type: string
                          required:
                          - ext_id
                        chrome:
                          type: object
                          properties:
                            ext_id:
                              type: string
                          required:
                          - ext_id
                      required:
                      - edge
                      - chrome
                    enable_browser_control_mode:
                      type: string
                    enable_browser_control_mode__scope:
                      type: object
                      properties:
                        scope:
                          type: string
                        binding_config:
                          type: object
                          properties:
                            include:
                              type: object
                              properties:
                                devices:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      uid:
                                        type: string
                                      name:
                                        type: string
                                      code:
                                        type: string
                              required:
                              - devices
                          required:
                          - include
                      required:
                      - scope
                      - binding_config
                  required:
                  - extension_options
                  - enable_browser_control_mode
                  - enable_browser_control_mode__scope
                browser_webpost_control_options:
                  type: object
                  properties:
                    enable_browser_control_mode:
                      type: string
                  required:
                  - enable_browser_control_mode
              required:
              - browser_depth_control_options
              - browser_webpost_control_options
            example:
              browser_depth_control_options:
                extension_options:
                  edge:
                    ext_id: lchpaajdlbdjnjbeeajicicfikpmdnmj
                  chrome:
                    ext_id: gnofllnnijbicdhkcjhjnieopjgmmncf
                enable_browser_control_mode: 'on'
                enable_browser_control_mode__scope:
                  scope: common
                  binding_config:
                    include:
                      devices:
                      - uid: 45ad1238-4c99-42a6-85c4-81e77dad60ed
                        name: DNAME003fdea82b10a7d9
                        code: PC-000046
              browser_webpost_control_options:
                enable_browser_control_mode: 'on'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example: {}
      security: []
