        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_fav:
                  type: boolean
              required:
              - is_fav
            example:
              is_fav: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      index:
                        type: array
                        items:
                          type: string
                      total:
                        type: integer
                      search_total:
                        type: integer
                      results:
                        type: object
                        properties:
                          staff:
                            type: object
                            properties:
                              value:
                                type: integer
                            required:
                            - value
                          device:
                            type: object
                            properties:
                              value:
                                type: integer
                            required:
                            - value
                        required:
                        - staff
                        - device
                    required:
                    - index
                    - total
                    - search_total
                    - results
                required:
                - code
                - msg
                - data
              example:
                code: 0
                msg: success
                data:
                  index:
                  - qzhddr_ueba
                  total: 19
                  search_total: 19
                  results:
                    staff:
                      value: 4
                    device:
                      value: 19
      security: []
