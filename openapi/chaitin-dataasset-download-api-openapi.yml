openapi: 3.0.3
info:
  title: APISec Management account dataasset/download API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: dataasset/download
  description: 数据资产/下载
paths:
  /dataasset/download:
    post:
      summary: 资产地图导出
      deprecated: false
      description: ''
      tags:
      - dataasset/download
      parameters:
      - name: X-CS-Header-App
        in: header
        description: 应用id
        required: true
        example: '{{app}}'
        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sort:
                  type: array
                  items:
                    type: string
                name:
                  type: string
                output:
                  type: object
                  properties:
                    ext:
                      type: string
                    fields:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          display_name:
                            type: string
                        required:
                        - name
                        - display_name
                  required:
                  - ext
                  - fields
                queries:
                  type: array
                  items: {}
              required:
              - sort
              - name
              - output
              - queries
            example:
              sort:
              - timestamp:desc
              name: test
              output:
                ext: xlsx
                fields:
                - name: staff_name
                  display_name: 员工姓名
                - name: device_code
                  display_name: 终端ID
                - name: filename
                  display_name: 文件名
                - name: md5_hash
                  display_name: 文件MD5
                - name: cl_name
                  display_name: 数据分类
                - name: category
                  display_name: 发现方式
                - name: data_level
                  display_name: 数据分级
                - name: data_level_name
                  display_name: 数据分级名称
                - name: dept_names
                  display_name: 部门名称
                - name: staff_tags
                  display_name: 员工标签
                - name: console_user
                  display_name: 系统账户
                - name: ip_address
                  display_name: IP地址
                - name: has_cls
                  display_name: 是否分类
                - name: dept_paths
                  display_name: 部门路径
                - name: filepath
                  display_name: 文件路径
                - name: file_suffix
                  display_name: 文件后缀
                - name: file_type
                  display_name: 文件类型
              queries: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example: {}
      security: []
