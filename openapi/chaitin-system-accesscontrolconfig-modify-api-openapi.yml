openapi: 3.0.3
info:
  title: APISec Management account system/accesscontrolconfig/modify API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: system/accesscontrolconfig/modify
  description: 系统配置/访问控制配置/修改
paths:
  /system/accesscontrolconfig/modify:
    post:
      summary: 准入界面配置（修改）
      deprecated: false
      description: ''
      tags:
      - system/accesscontrolconfig/modify
      parameters:
      - name: X-CS-Header-App
        in: header
        description: 应用id
        required: true
        example: '{{app}}'
        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tips_text:
                  type: string
                guest_wifi:
                  type: string
                staff_wifi:
                  type: string
                client_title_name:
                  type: string
                access_control_status:
                  type: boolean
                forgot_guest_wifi:
                  type: boolean
                windows_eiam_effect_range:
                  type: string
              required:
              - tips_text
              - guest_wifi
              - staff_wifi
              - client_title_name
              - access_control_status
              - forgot_guest_wifi
              - windows_eiam_effect_range
            example:
              tips_text: 遇到问题请联系it运维人员
              guest_wifi: wifi_ssid_123456
              staff_wifi: wifi_ssid_123456
              client_title_name: 薮猫科技网络准入客户端
              access_control_status: true
              forgot_guest_wifi: true
              windows_eiam_effect_range: all
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      client_title_name:
                        type: string
                      forgot_ssid_list:
                        type: array
                        items:
                          type: string
                      windows_eiam_effect_range:
                        type: string
                      tips_text:
                        type: string
                      staff_wifi:
                        type: string
                      enable_forgot_ssid:
                        type: boolean
                      access_control_status:
                        type: boolean
                      forgot_ssid_enabled:
                        type: boolean
                      guest_wifi:
                        type: string
                    required:
                    - client_title_name
                    - forgot_ssid_list
                    - windows_eiam_effect_range
                    - tips_text
                    - staff_wifi
                    - enable_forgot_ssid
                    - access_control_status
                    - forgot_ssid_enabled
                    - guest_wifi
                required:
                - code
                - msg
                - data
              example:
                code: 0
                msg: success
                data:
                  client_title_name: 薮猫科技网络准入客户端
                  forgot_ssid_list:
                  - ssid_1
                  - ssid_2
                  windows_eiam_effect_range: all
                  tips_text: 遇到问题请联系it运维人员
                  staff_wifi: wifi_ssid_123456
                  enable_forgot_ssid: false
                  access_control_status: true
                  forgot_ssid_enabled: false
                  guest_wifi: wifi_ssid_123456
      security: []
