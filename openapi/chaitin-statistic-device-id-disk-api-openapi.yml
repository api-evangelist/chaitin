openapi: 3.0.3
info:
  title: APISec Management account statistic/{device_id}/disk API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: statistic/{device_id}/disk
  description: 统计分析/device_id 参数/磁盘
paths:
  /statistic/{device_id}/disk:
    post:
      summary: 终端硬盘
      deprecated: false
      description: ''
      tags:
      - statistic/{device_id}/disk
      parameters:
      - name: device_id
        in: path
        description: ''
        required: true
        example: a531ef8a-c817-41e6-875b-e70da1cd9963
        schema:
          type: string
      - name: X-CS-Header-App
        in: header
        description: 应用id
        required: true
        example: '{{app}}'
        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        model:
                          type: string
                        sn:
                          type: string
                        used:
                          type: integer
                        size:
                          type: integer
                        partitions:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              size:
                                type: integer
                              used:
                                type: integer
                required:
                - code
                - msg
                - data
              example:
                code: 0
                msg: success
                data:
                - model: test 250GB
                  sn: xxxxx
                  used: 300
                  size: 600
                  partitions:
                  - name: C
                    size: 100
                    used: 50
      security: []
