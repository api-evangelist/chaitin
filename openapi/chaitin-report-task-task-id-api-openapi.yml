        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                dashboard_id:
                  type: string
                period_options:
                  type: object
                  properties:
                    hour:
                      type: integer
                    minute:
                      type: integer
                    period_category:
                      type: string
