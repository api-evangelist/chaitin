                  - hour
                  - minute
                  - period_category
                  - day
                  - weekday
                send_channel:
                  type: string
                notification_bot_ids:
                  type: array
                  items:
                    type: string
                email_topic:
                  type: string
                append_time:
                  type: boolean
                email_receivers:
                  type: array
                  items:
                    type: string
                send_options:
