              - period_options
              - send_channel
              - notification_bot_ids
              - email_topic
              - append_time
              - email_receivers
              - send_options
              - period_category
            example:
              name: 旺测试
              dashboard_id: 6ce2041a-351c-40e4-8c50-2d6142750d30
              period_options:
                hour: 17
                minute: 30
                period_category: day
                day: null
                weekday: null
              send_channel: email
              notification_bot_ids:
              - 572f41b8-c72c-426c-b7f0-346a263a4b41
              email_topic: 报告订阅测试
              append_time: true
              email_receivers:
              - xingwang.xu@cyberserval.cn
              send_options:
                send_text: true
