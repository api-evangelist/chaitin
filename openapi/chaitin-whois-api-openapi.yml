paths:
  /v1/seed/domain:
    get:
      deprecated: false
      description: ''
      parameters:
      - description: 空间ID
        in: query
        name: space
        required: false
        schema:
          type: integer
      - description: 种子条目，模糊搜索
        in: query
        name: name
        required: false
        schema:
          type: string
      - description: 监控是否启用
        example: 'true'
        in: query
        name: enable
        required: false
        schema:
          type: boolean
      - description: 置信度
        example: '100'
        in: query
        name: confidence
        required: false
        schema:
          enum:
          - '60'
          - '100'
          type: string
          x-apifox:
            enumDescriptions:
              '60': 模糊线索
              '100': 精确线索
      - description: 类型
        in: query
        name: type
        required: false
        schema:
          enum:
          - NS
          - MX
          - 注册邮箱
          type: string
          x-apifox:
            enumDescriptions:
              MX: MX
              NS: NS
              注册邮箱: 注册邮箱
      - description: 排序字段，字段前加-表示降序，默认排序为-id
        example: id、created_at、updated_at
        in: query
        name: sort
        required: false
        schema:
          type: string
      - description: 页码
        example: 1
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: 分页大小
        example: 20
        in: query
        name: size
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              example:
                code: 200
                data:
                  current: 1
                  items:
                  - confidence: '100'
                    created_at: '2023-08-15 14:25:12'
                    enable: true
                    id: 1
                    name: test
                    type: NS
                    updated_at: '2023-08-15 14:25:17'
                  size: 20
                  total: 1
                message: ''
              schema:
                properties:
                  code:
                    title: 响应码
                    type: integer
                  data:
                    properties:
                      current:
                        title: 当前页
                        type: integer
                      items:
                        items:
                          properties:
                            confidence:
                              title: 置信度
                              type: string
                            created_at:
                              title: 创建时间
                              type: string
                            enable:
                              title: 监控是否启用
                              type: boolean
                            id:
                              title: id
                              type: integer
                            name:
                              title: 线索条目
