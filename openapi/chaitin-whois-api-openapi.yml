                                  MX: MX
                                  NS: NS
                                  注册邮箱: 注册邮箱
                            updated_at:
                              title: 更新时间
                              type: string
                          type: object
                          x-apifox-orders:
                          - id
                          - name
                          - type
                          - enable
                          - confidence
                          - updated_at
                          - created_at
                        type: array
                      size:
                        title: 分页大小
                        type: integer
                      total:
                        title: 总数
                        type: integer
                    required:
                    - current
                    - size
                    - total
                    - items
                    title: 数据
                    type: object
                    x-apifox-orders:
                    - current
                    - size
                    - total
                    - items
                  message:
                    title: 消息
                    type: string
                required:
                - code
                - message
                - data
