openapi: 3.0.3
info:
  title: APISec Management account software/uninstall/instance API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: software/uninstall/instance
  description: 软件分发与卸载/uninstall 接口/实例
paths:
  /software/uninstall/instance:
    post:
      summary: 实例创建
      deprecated: false
      description: ''
      tags:
      - software/uninstall/instance
      parameters:
      - name: X-CS-Header-App
        in: header
        description: 应用id
        required: true
        example: '{{app}}'
        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scope:
                  type: string
                uninstall_source_list:
                  type: array
                  items:
                    type: object
                    properties:
                      registry_id:
                        type: string
                      pkg_id:
                        type: string
                      bundle_id:
                        type: string
                      display_name:
                        type: string
                      uninstall_command:
                        type: string
                      family:
                        type: string
                      category:
                        type: string
                    required:
                    - registry_id
                    - display_name
                    - uninstall_command
                    - family
                    - category
                binding_config:
                  type: object
                  properties:
                    source:
                      type: string
                    include:
                      type: object
                      properties:
                        device_ids:
                          type: array
                          items: {}
                        device_tag_ids:
                          type: array
                          items: {}
                        staff_tag_ids:
                          type: array
                          items: {}
                        staff_ids:
                          type: array
                          items: {}
                        dept_ids:
                          type: array
                          items: {}
                      required:
                      - device_ids
                      - device_tag_ids
                      - staff_tag_ids
                      - staff_ids
                      - dept_ids
                    exclude:
                      type: object
                      properties:
                        dept_ids:
                          type: array
                          items: {}
                        staff_ids:
                          type: array
                          items: {}
                        staff_tag_ids:
                          type: array
                          items: {}
                        device_ids:
                          type: array
                          items: {}
                        device_tag_ids:
                          type: array
                          items: {}
                      required:
                      - dept_ids
                      - staff_ids
                      - staff_tag_ids
                      - device_ids
                      - device_tag_ids
                  required:
                  - source
                  - include
                  - exclude
              required:
              - name
              - scope
              - uninstall_source_list
              - binding_config
            example:
              name: 测试11
              scope: global
              uninstall_source_list:
              - registry_id: registry_id1
                pkg_id: pkg_id
                bundle_id: bundle_id
                display_name: 测试软件1
                uninstall_command: 删除命令
                family: Windows
                category: im
              - registry_id: registry_id2
                display_name: 测试软件2
                uninstall_command: 删除命令
                family: Windows
                category: im
              binding_config:
                source: software_uninstall
                include:
                  device_ids: []
                  device_tag_ids: []
                  staff_tag_ids: []
                  staff_ids: []
                  dept_ids: []
                exclude:
                  dept_ids: []
                  staff_ids: []
                  staff_tag_ids: []
                  device_ids: []
                  device_tag_ids: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      create_time:
                        type: string
                      update_time:
                        type: string
                      scope:
                        type: string
                      uninstall_source_list:
                        type: array
                        items:
                          type: object
                          properties:
                            display_category:
                              type: string
                            uninstall_command:
                              type: string
                            registry_id:
                              type: string
                            family:
                              type: string
                            display_name:
                              type: string
                            category:
                              type: string
                          required:
                          - display_category
                          - uninstall_command
                          - registry_id
                          - family
                          - display_name
                          - category
                      update_by_id:
                        type: string
                      create_by_id:
                        type: string
                      id:
                        type: integer
                      uid:
                        type: string
                      company_id:
                        type: string
                      status:
                        type: string
                      name:
                        type: string
                    required:
                    - create_time
                    - update_time
                    - scope
                    - uninstall_source_list
                    - update_by_id
                    - create_by_id
                    - id
                    - uid
                    - company_id
                    - status
                    - name
                required:
                - code
                - msg
                - data
              example:
                code: 0
                msg: Normal
                data:
                  create_time: '2024-10-22T05:56:06.416716Z'
                  update_time: '2024-10-22T05:56:06.416746Z'
