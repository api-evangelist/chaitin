                                      - webhook
                                  required:
                                  - im_notification
                              required:
                              - uid
                              - name
                              - category
                              - config
                            notification_content_template:
                              type: object
                              properties:
                                uid:
                                  type: string
                                name:
                                  type: string
                                template_model:
                                  type: string
                                template_value:
                                  type: string
                              required:
                              - uid
                              - name
                              - template_model
                              - template_value
