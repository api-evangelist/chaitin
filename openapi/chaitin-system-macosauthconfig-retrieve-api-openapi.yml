                              zh-cn:
                                type: string
                              zh-hant:
                                type: string
                            required:
                            - en
                            - zh-cn
                            - zh-hant
                          uninstall_guide:
                            type: object
                            properties:
                              en:
                                type: string
                              zh-cn:
                                type: string
                              zh-hant:
                                type: string
                            required:
                            - en
                            - zh-cn
                            - zh-hant
                        required:
                        - auth_guide
                        - uninstall_guide
                      noauth_alert_max_count:
                        type: integer
                      network_extension_check:
                        type: boolean
                      full_disk_access:
                        type: boolean
                      notification_config:
                        type: array
                        items:
                          type: object
                          properties:
                            notification_bot_template_id:
                              type: string
                            notification_bot:
                              type: object
                              properties:
                                uid:
                                  type: string
                                name:
                                  type: string
                                category:
                                  type: string
                                config:
                                  type: object
                                  properties:
                                    im_notification:
                                      type: object
                                      properties:
                                        webhook:
                                          type: string
