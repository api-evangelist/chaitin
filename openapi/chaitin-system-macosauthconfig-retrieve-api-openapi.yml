        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      auth_check_options:
                        type: object
                        properties:
                          network_extension_stay:
                            type: string
                          screenshot_noauth_mode:
                            type: string
                          network_extension_mode:
                            type: string
                          network_extension_mode__scope:
                            type: object
                            properties:
                              binding_config:
                                type: object
                                properties: {}
                              scope:
                                type: string
                            required:
                            - binding_config
                            - scope
                          screenshot_noauth_mode__scope:
                            type: object
                            properties:
                              binding_config:
                                type: object
                                properties:
                                  exclude:
                                    type: object
                                    properties:
                                      devices:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            uid:
                                              type: string
                                            name:
                                              type: string
                                            code:
                                              type: string
                                          required:
                                          - uid
                                          - name
                                          - code
                                    required:
                                    - devices
                                  include:
                                    type: object
                                    properties:
                                      devices:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            uid:
                                              type: string
                                            name:
                                              type: string
                                            code:
                                              type: string
                                          required:
                                          - uid
                                          - name
                                          - code
                                    required:
                                    - devices
                                required:
                                - exclude
                                - include
                              scope:
                                type: string
                            required:
                            - binding_config
                            - scope
                          full_disk_access_mode:
                            type: string
                        required:
                        - network_extension_stay
                        - screenshot_noauth_mode
                        - network_extension_mode
                        - network_extension_mode__scope
                        - screenshot_noauth_mode__scope
                        - full_disk_access_mode
