openapi: 3.0.3
info:
  title: APISec Management account installer/tast_template/update API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: installer/tast_template/update
  description: 终端安装包/任务模板/更新
paths:
  /installer/tast_template/update:
    post:
      summary: 修改模版
      deprecated: false
      description: ''
      tags:
      - installer/tast_template/update
      parameters:
      - name: X-CS-Header-App
        in: header
        description: 应用id
        required: true
        example: '{{app}}'
        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pk:
                  type: string
                name:
                  type: string
                release_strategy:
                  type: string
                period_options:
                  type: object
                  properties:
                    period_hours_value:
                      type: array
                      items:
                        type: object
                        properties:
                          begin:
                            type: string
                          end:
                            type: string
                          week:
                            type: integer
                        required:
                        - begin
                        - end
                        - week
                  required:
                  - period_hours_value
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      include:
                        type: object
                        properties: {}
                      min_rate:
                        type: integer
                      scope:
                        type: string
                      step_category:
                        type: string
                      exclude:
                        type: object
                        properties: {}
                      step:
                        type: integer
                      delay_options:
                        type: object
                        properties:
                          measure:
                            type: string
                          enabled:
                            type: boolean
                          value:
                            type: integer
                        required:
                        - measure
                        - enabled
                        - value
                    required:
                    - include
                    - min_rate
                    - scope
                    - step_category
                    - exclude
                    - step
                    - delay_options
                period_category:
                  type: string
              required:
              - pk
              - name
              - release_strategy
              - period_options
              - steps
              - period_category
            example:
              pk: '1'
              name: 默认升级模版
              release_strategy: entity
              period_options:
                period_hours_value:
                - begin: 00:00
                  end: '23:59'
                  week: 1
                - begin: 00:00
                  end: '23:59'
                  week: 2
                - begin: 00:00
                  end: '23:59'
                  week: 3
                - begin: 00:00
                  end: '23:59'
                  week: 4
                - begin: 00:00
                  end: '23:59'
                  week: 5
                - begin: 00:00
                  end: '23:59'
                  week: 6
                - begin: 00:00
                  end: '23:59'
                  week: 7
              steps:
              - include: {}
                min_rate: 10000
                scope: global
                step_category: manual
                exclude: {}
                step: 1
                delay_options:
                  measure: hour
                  enabled: false
                  value: 10
              - include: {}
                min_rate: 10000
                scope: global
                step_category: manual
                exclude: {}
                step: 1
                delay_options:
                  measure: hour
                  enabled: false
                  value: 10
              period_category: permanent
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example: {}
      security: []
