                        - enable
                        - should_overwrite
                        - should_prompt
                      staff:
                        type: object
                        properties:
                          enable:
                            type: boolean
                          should_overwrite:
                            type: boolean
                          should_prompt:
                            type: boolean
                        required:
                        - enable
                        - should_overwrite
                        - should_prompt
                    required:
                    - admin
                    - auto
                    - staff
                required:
