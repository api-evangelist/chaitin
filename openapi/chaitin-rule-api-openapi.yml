openapi: 3.2.0
info:
  description: mgt API swagger document.
  title: mgt Rule API
  contact: {}
  version: '2.0'
servers:
- url: /api
tags:
- name: Rule
paths:
  /open/policy:
    get:
      tags:
      - Rule
      summary: list customized rule
      parameters:
      - name: action
        in: query
        x-cli-description: 动作类型：0-放行 1-阻断 2-挑战 3-认证防护 4-混淆 5-等待室
        schema:
          type: integer
          maximum: 3
          minimum: -1
      - name: page
        in: query
        x-cli-description: 页码
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        x-cli-description: 每页数量
        schema:
          type: integer
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response.JSONBody'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/policy.ListPolicyRes'
      x-cli-summary: 获取自定义规则列表
      operationId: getOpenPolicy
      x-operation-id-source: derived
    post:
      tags:
      - Rule
      summary: create customized rule
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response.JSONBody'
                - type: object
                  properties:
                    data:
                      type: integer
      x-cli-summary: 创建自定义规则
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/policy.PostPolicyReq'
        description: request params
        required: true
      operationId: postOpenPolicy
      x-operation-id-source: derived
    put:
      tags:
      - Rule
      summary: update customized rule
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.JSONBody'
      x-cli-summary: 更新自定义规则
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/policy.PutPolicyReq'
        description: request params
        required: true
      operationId: putOpenPolicy
      x-operation-id-source: derived
    delete:
      tags:
      - Rule
      summary: delete customized rule
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.JSONBody'
      x-cli-summary: 删除自定义规则
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/policy.DeletePolicyReq'
        description: request params
        required: true
      operationId: deleteOpenPolicy
      x-operation-id-source: derived
  /open/policy/detail:
    get:
      tags:
      - Rule
      summary: get customized rule detail
      parameters:
      - name: id
        in: query
        x-cli-description: 资源 ID
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response.JSONBody'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/policy.GetPolicyRes'
      x-cli-summary: 获取自定义规则详情
      operationId: getOpenPolicyDetail
      x-operation-id-source: derived
  /open/policy/switch:
    put:
      tags:
      - Rule
      summary: enable/disable customized rule
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.JSONBody'
      x-cli-summary: 启用/禁用自定义规则
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/policy.PutPolicySwitchReq'
        description: request params
        required: true
      operationId: putOpenPolicySwitch
      x-operation-id-source: derived
components:
  schemas:
    policy.DeletePolicyReq:
      type: object
      properties:
        id:
          type: integer
    policy.GetPolicyRes:
      type: object
      properties:
        action:
          description: 0 -> allow, 1 -> deny
          allOf:
          - $ref: '#/components/schemas/model.PolicyAction'
        auth_callback:
          type: string
        auth_rule:
          type: integer
        auth_source_ids:
          type: array
          items:
            type: integer
        black_rule:
          type: integer
        builtin:
          type: boolean
        captcha_rule:
          type: integer
        cloud_id:
          type: integer
        cloud_total:
          type: integer
        compatible:
          type: integer
        created_at:
          type: string
        expire:
          type: integer
        id:
          type: integer
        is_enabled:
          type: boolean
        level:
          type: integer
        log:
          type: boolean
        name:
          type: string
        negate:
          type: boolean
        pass_count:
          type: integer
        pattern:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/model.RulePattern'
        replay:
          type: boolean
        req_count:
          type: integer
        review:
          $ref: '#/components/schemas/model.PolicyReview'
        tfa_enabled:
          type: boolean
        updated_at:
          type: string
        white_rule:
          type: integer
    model.RulePattern:
      type: object
      properties:
        k:
          type: string
        op:
          type: string
        sub_k:
          type: string
        v:
          type: array
          items:
            type: string
    policy.PutPolicySwitchReq:
      type: object
      properties:
        id:
          type: integer
        is_enabled:
          type: boolean
    policy.PutPolicyReq:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/model.PolicyAction'
        expire:
          type: integer
        id:
          type: integer
        is_enabled:
          type: boolean
        level:
          type: integer
        log:
          type: boolean
        name:
          type: string
        pattern:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/model.RulePattern'
    policy.ListPolicyRes:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/policy.GetPolicyRes'
        total:
          type: integer
    response.JSONBody:
      type: object
      properties:
        data: {}
        err:
          type: string
        msg:
          type: string
    policy.PostPolicyReq:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/model.PolicyAction'
        expire:
          type: integer
        is_enabled:
          type: boolean
        level:
          type: integer
        log:
          type: boolean
        name:
          type: string
        pattern:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/model.RulePattern'
    model.PolicyAction:
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 999
      - 999
      x-enum-varnames:
      - PolicyActionAllow
      - PolicyActionDeny
      - PolicyActionChallenge
      - PolicyActionAuthDefense
      - PolicyActionChaos
      - PolicyActionWaitingRoom
      - PolicyActionMix
      - PolicyActionMax
    model.PolicyReview:
      type: integer
      enum:
      - 0
      - 1
      x-enum-varnames:
      - PolicyReviewRequired
      - PolicyReviewNone
