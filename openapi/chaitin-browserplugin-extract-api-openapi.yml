openapi: 3.0.3
info:
  title: APISec Management account browserplugin/extract API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: browserplugin/extract
  description: 浏览器插件/提取
paths:
  /browserplugin/extract:
    post:
      summary: 插件源导入
      deprecated: false
      description: ''
      tags:
      - browserplugin/extract
      parameters:
      - name: X-CS-Header-App
        in: header
        description: 应用id
        required: true
        example: '{{app}}'
        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: multipart/form-data
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  example: 'null'
                  type: string
                  format: binary
                overwrite:
                  example: 'true'
                  type: string
              required:
              - file
              - overwrite
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        browser:
                          type: string
                        plugin_name:
                          type: string
                        plugin_id:
                          type: string
                        description:
                          type: string
                required:
                - code
                - msg
                - data
              example:
                code: 0
                msg: 正常
                data:
                - browser: Chrome
                  plugin_name: 某插件名
                  plugin_id: asudhasud839892
                  description: 描述
      security: []
