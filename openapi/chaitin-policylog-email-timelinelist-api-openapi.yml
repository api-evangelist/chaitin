openapi: 3.0.3
info:
  title: APISec Management account policylog/email/timelinelist API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: policylog/email/timelinelist
  description: 日志中心/邮件/时间线列表
paths:
  /policylog/email/timelinelist:
    post:
      summary: 邮件管控时间线
      deprecated: false
      description: ''
      tags:
      - policylog/email/timelinelist
      parameters:
      - name: X-CS-Header-App
        in: header
        description: 应用id
        required: true
        example: '{{app}}'
        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                time_range:
                  type: object
                  properties:
                    begin:
                      type: string
                    end:
                      type: string
                  required:
                  - begin
                  - end
                search:
                  type: string
                queries:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                      operator:
                        type: string
                      value:
                        type: string
              required:
              - time_range
              - search
              - queries
            example:
              time_range:
                begin: '2023-11-14 10:55:38'
                end: '2023-11-14 11:55:38'
              search: ''
              queries:
              - field: staff_name
                operator: is
                value: 吴贝宁
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      index:
                        type: array
                        items:
                          type: string
                      total:
                        type: integer
                      search_total:
                        type: integer
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            start:
                              type: string
                            end:
                              type: string
                            title:
                              type: string
                            title_display:
                              type: string
                            list:
                              type: array
                              items:
                                type: object
                                properties:
                                  content:
                                    type: string
                                  content_display:
                                    type: string
                                  cnt:
                                    type: integer
                                  icon:
                                    type: 'null'
                                required:
                                - content
                                - content_display
                                - cnt
                                - icon
                          required:
                          - start
                          - end
                          - title
                          - title_display
                          - list
                      title_field:
                        type: string
                    required:
                    - index
                    - total
                    - search_total
                    - results
                    - title_field
                required:
                - code
                - msg
                - data
              example:
                code: 0
                msg: success
                data:
                  index:
                  - qzhddr_policy_email_logs
                  total: 16
                  search_total: 16
                  results:
                  - start: '2023-06-15 09:00:00'
                    end: '2023-06-15 10:00:00'
                    title: foxmail
                    title_display: Foxmail邮件
                    list:
                    - content: ban_attachment
                      content_display: 外发邮件中禁止包含附件
                      cnt: 8
                      icon: null
                  - start: '2023-06-15 17:00:00'
                    end: '2023-06-15 18:00:00'
                    title: foxmail
                    title_display: Foxmail邮件
                    list:
                    - content: ban_attachment
                      content_display: 外发邮件中禁止包含附件
                      cnt: 3
                      icon: null
                  - start: '2023-09-12 17:00:00'
                    end: '2023-09-12 18:00:00'
                    title: foxmail
                    title_display: Foxmail邮件
                    list:
                    - content: cc_direct
                      content_display: 外发邮件中需要抄送/密送直属领导
                      cnt: 1
                      icon: null
                  - start: '2023-09-17 01:00:00'
                    end: '2023-09-17 02:00:00'
                    title: foxmail
                    title_display: Foxmail邮件
                    list:
                    - content: ban_attachment
                      content_display: 外发邮件中禁止包含附件
                      cnt: 2
                      icon: null
                  - start: '2023-09-19 11:00:00'
                    end: '2023-09-19 12:00:00'
                    title: foxmail
                    title_display: Foxmail邮件
                    list:
                    - content: ban_attachment
                      content_display: 外发邮件中禁止包含附件
                      cnt: 2
                      icon: null
                  title_field: channel
      security: []
