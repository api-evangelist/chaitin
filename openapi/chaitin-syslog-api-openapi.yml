openapi: 3.0.3
info:
  title: APISec Management account Syslog 管理与系统日志 API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: Syslog 管理与系统日志
paths:
  /api/log/syslog/list:
    post:
      operationId: syslog_config_list
      requestBody:
        content:
          application/json:
            schema:
              description: 可选分页类请求的通用模式
              properties:
                limit:
                  description: 最多返回k个满足条件的数据，为None时表示不限制数量
                  exclusiveMinimum: true
                  minimum: 0
                  title: limit
                  type: integer
                offset:
                  default: 0
                  description: 跳过前k个满足条件的数据
                  minimum: 0
                  title: offset
                  type: integer
              title: SyslogConfigListArg
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                description: 分页类响应的通用模式
                properties:
                  data:
                    description: 实际返回的数据
                    items:
                      $ref: '#/components/schemas/SyslogConfigDetail'
                    title: Data
                    type: array
                  total:
                    description: 满足条件的记录总数
                    minimum: 0
                    title: Total
                    type: integer
                required:
                - total
                - data
                title: SyslogConfigListRet
                type: object
          description: ''
      summary: syslog配置列表
      tags:
      - Syslog 管理与系统日志
  /api/log/syslog/delete:
    post:
      operationId: delete_syslog_config
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ids:
                  description: 待删除的配置信息ID
                  items:
                    type: integer
                  title: Ids
                  type: array
              required:
              - ids
              title: DeleteSyslogConfigArg
              type: object
