                  minimum: 1
                  title: Port
                  type: integer
                portrait_event:
                  description: 是否报告溯源事件
                  title: Portrait Event
                  type: boolean
                scanner_event:
                  description: 是否报告扫描事件
                  title: Scanner Event
                  type: boolean
                socket_type:
                  description: syslog的网络传输方式
                  enum:
                  - TCP
                  - UDP
                  title: Socket Type
                time_diff:
                  default: 0
                  description: 自定义加减整数时间差
                  title: Time Diff
                  type: integer
              required:
