        '200':
          content:
            application/json:
              schema:
                description: '最小化响应的通用模式


                  使用该类型作为返回值的API view，一般不会失败(诸如login_required等错误不包含在内)'
                properties:
                  success:
                    default: true
                    description: 请求成功
                    title: Success
                    type: boolean
                title: MinimumRet
                type: object
          description: ''
      summary: 删除syslog配置信息
      tags:
      - Syslog 管理与系统日志
  /api/log/syslog/add:
    post:
      operationId: add_syslog_config
      requestBody:
        content:
          application/json:
            schema:
              properties:
                agent_status:
                  description: 是否报告探针连接状态变化
                  title: Agent Status
                  type: boolean
                arp_event:
                  description: 是否报告ARP攻击
                  title: Arp Event
                  type: boolean
                docker_escape:
                  description: 是否报告docker逃逸事件
                  title: Docker Escape
                  type: boolean
                encoding:
                  description: syslog编码方式
                  enum:
                  - Unicode
                  - UTF-8
                  title: Encoding
                format:
                  default: rfc5424
                  description: syslog格式
                  enum:
                  - rfc3164
                  - rfc5424
                  title: Format
                honeypot_event:
                  description: 是否报告蜜罐事件
                  title: Honeypot Event
                  type: boolean
                host:
                  description: syslog服务器地址
                  minLength: 1
                  title: Host
                  type: string
                is_base64_decode:
                  default: false
                  description: 是否base64解码日志中的header
                  title: Is Base64 Decode
                  type: boolean
                ping_event:
                  description: 是否报告ping事件
                  title: Ping Event
                  type: boolean
                port:
                  description: syslog服务器端口
                  maximum: 65535
                  minimum: 1
                  title: Port
                  type: integer
                portrait_event:
                  description: 是否报告溯源事件
                  title: Portrait Event
                  type: boolean
                scanner_event:
                  description: 是否报告扫描事件
                  title: Scanner Event
                  type: boolean
                socket_type:
                  description: syslog的网络传输方式
                  enum:
                  - TCP
                  - UDP
                  title: Socket Type
                time_diff:
                  default: 0
                  description: 自定义加减整数时间差
                  title: Time Diff
                  type: integer
              required:
              - host
              - port
              - encoding
              - honeypot_event
              - scanner_event
              - ping_event
              - portrait_event
              - arp_event
              - docker_escape
              - agent_status
              - socket_type
              title: AddSyslogConfigArg
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  id:
                    description: 新创建的配置信息的ID
                    title: Id
                    type: integer
                required:
                - id
                title: AddSyslogConfigRet
                type: object
          description: ''
      summary: 添加syslog配置信息
      tags:
      - Syslog 管理与系统日志
