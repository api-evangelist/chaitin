                limit:
                  description: 最多返回k个满足条件的数据，为None时表示不限制数量
                  exclusiveMinimum: true
                  minimum: 0
                  title: limit
                  type: integer
                log_types:
                  default: []
                  description: 系统日志类型, 1 表示系统负载，2 表示docker状态，3 表示探针状态
                  items:
                    enum:
                    - 1
                    - 2
                    - 3
                    - 4
                    type: integer
                  title: Log Types
                  type: array
                not_after:
                  description: 结束时间
                  format: date-time
                  title: Not After
                  type: string
                not_before:
                  description: 起始时间
                  format: date-time
                  title: Not Before
                  type: string
                offset:
                  default: 0
                  description: 跳过前k个满足条件的数据
                  minimum: 0
                  title: offset
                  type: integer
              title: SystemLogListArgs
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/SystemLogRet'
                    default: []
                    description: 系统日志的列表信息
                    title: Data
                  err:
                    default: ''
                    description: 错误信息
                    title: Err
                    type: string
                  msg:
                    default: ''
                    description: 具体错误信息描述
                    title: Msg
                    type: string
                title: ListSystemLogRet
                type: object
          description: ''
      summary: 系统日志的列表信息
