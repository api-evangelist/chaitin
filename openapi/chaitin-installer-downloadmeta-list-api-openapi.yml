                      type: object
                      properties:
                        title:
                          type: string
                        comment:
                          type: string
                        address:
                          type: object
                          properties:
                            scheme:
                              type: string
                            port:
                              type: integer
                            name:
                              type: string
                            env:
                              type: string
                            heartbeat_port:
                              type: integer
                            is_default:
                              type: boolean
                            host:
