paths:
  /exportrecord/{task_id}/download:
    post:
      summary: 导出结果下载
      deprecated: false
      description: ''
      tags:
      - exportrecord/{task_id}/download
      parameters:
      - name: task_id
        in: path
        description: ''
        required: true
        example: 4854d81d-8cc5-48cf-b092-1a4ade6e6636
        schema:
          type: string
      - name: X-CS-Header-App
        in: header
        description: 应用id
        required: true
        example: '{{app}}'
        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      etag:
                        type: string
                      relative_path:
                        type: string
                      last_modified:
                        type: string
                      size:
                        type: integer
                      content_type:
                        type: string
                      filename:
                        type: string
                      url:
                        type: string
                      url_path:
                        type: string
                    required:
                    - etag
                    - relative_path
                    - last_modified
                    - size
                    - content_type
                    - filename
                    - url
                    - url_path
                required:
                - code
                - msg
                - data
