openapi: 3.0.3
info:
  title: APISec Management account system/filebehaviorconfig/retrieve API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: system/filebehaviorconfig/retrieve
  description: 系统配置/文件行为配置/获取
paths:
  /system/filebehaviorconfig/retrieve:
    post:
      summary: 行为日志配置 - 获取
      deprecated: false
      description: ''
      tags:
      - system/filebehaviorconfig/retrieve
      parameters:
      - name: X-CS-Header-App
        in: header
        description: 应用id
        required: true
        example: '{{app}}'
        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      file_types:
                        type: array
                        items:
                          type: string
                      excluded_dirs:
                        type: object
                        properties:
                          Windows:
                            type: object
                            properties:
                              dirs:
                                type: array
                                items:
                                  type: string
                            required:
                            - dirs
                          macOS:
                            type: object
                            properties:
                              dirs:
                                type: array
                                items:
                                  type: string
                            required:
                            - dirs
                          Linux:
                            type: object
                            properties:
                              dirs:
                                type: array
                                items: {}
                            required:
                            - dirs
                          UOS:
                            type: object
                            properties:
                              dirs:
                                type: array
                                items: {}
                            required:
                            - dirs
                          Kylin:
                            type: object
                            properties:
                              dirs:
                                type: array
                                items: {}
                            required:
                            - dirs
                        required:
                        - Windows
                        - macOS
                        - Linux
                        - UOS
                        - Kylin
                      excluded_processes:
                        type: object
                        properties:
                          Windows:
                            type: object
                            properties:
                              process_names:
                                type: array
                                items:
                                  type: string
                            required:
                            - process_names
                          macOS:
                            type: object
                            properties:
                              process_names:
                                type: array
                                items:
                                  type: string
                            required:
                            - process_names
                        required:
                        - Windows
                        - macOS
                    required:
                    - file_types
                    - excluded_dirs
                    - excluded_processes
                required:
                - code
                - msg
                - data
              example:
                code: 0
                msg: success
                data:
                  file_types:
                  - txt
                  - rtf
                  - pdf
                  - wps
                  - doc
                  - docx
                  - dotx
                  - dot
                  - docm
                  - dotm
                  - ppt
                  - pot
                  - pps
                  - pptx
                  - potx
                  - ppsx
                  - pptm
                  - potm
                  - ppsm
                  - vsd
                  - vsdx
                  - vsdm
                  - vssm
                  - xls
                  - xlt
                  - xlsx
                  - xltx
                  - xlsm
                  - xltm
                  - key
                  - numbers
                  - pages
                  - mpp
                  - mpt
                  - drw
                  - mdd
                  - dxf
                  - dwg
                  - dwf
                  - max
                  - 3ds
                  - 3mf
                  - psd
                  - psb
                  - graffle
                  excluded_dirs:
                    Windows:
                      dirs:
                      - C://路径
                    macOS:
                      dirs:
                      - /Users/xxx/xxxx
                    Linux:
                      dirs: []
                    UOS:
                      dirs: []
                    Kylin:
                      dirs: []
                  excluded_processes:
                    Windows:
                      process_names:
                      - feishu.exe
                    macOS:
                      process_names:
                      - Feishu
      security: []
