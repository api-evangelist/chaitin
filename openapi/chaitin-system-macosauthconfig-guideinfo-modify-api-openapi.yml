    post:
      summary: 终端配置 - macOS授权 Copy
      deprecated: false
      description: ''
      tags:
      - system/macosauthconfig/guideinfo/modify
      parameters:
      - name: X-CS-Header-App
        in: header
        description: 应用id
        required: true
        example: '{{app}}'
        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
