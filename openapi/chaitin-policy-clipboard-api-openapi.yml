openapi: 3.0.3
info:
  title: APISec Management account policy/clipboard API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: policy/clipboard
  description: 策略管理/剪贴板
paths:
  /policy/clipboard/:
    post:
      summary: 剪切板管控策略创建
      deprecated: false
      description: ''
      tags:
      - policy/clipboard
      parameters:
      - name: X-CS-Header-App
        in: header
        description: 应用id
        required: true
        example: '{{app}}'
        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                period_category:
                  type: string
                scope:
                  type: string
                family:
                  type: string
                control_category:
                  type: string
                expression_fields:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                      operator:
                        type: string
                      value:
                        type: array
                        items:
                          type: string
                action:
                  type: string
                binding_config:
                  type: object
                  properties:
                    source:
                      type: string
                    include:
                      type: object
                      properties:
                        device_ids:
                          type: array
                          items:
                            type: string
                      required:
                      - device_ids
                    exclude:
                      type: object
                      properties: {}
                  required:
                  - source
                  - include
                  - exclude
              required:
              - name
              - period_category
              - scope
              - family
              - control_category
              - expression_fields
              - action
              - binding_config
            example:
              name: '111111'
              period_category: permanent
              scope: common
              family: Windows
              control_category: copy
              expression_fields:
              - field: source_process
                operator: contains
                value:
                - hhhh.exe
              action: notify
              binding_config:
                source: clipboard
                include:
                  device_ids:
                  - 1c16c892-242c-467c-add4-8ab0f00f26e9
                exclude: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example: {}
      security: []
