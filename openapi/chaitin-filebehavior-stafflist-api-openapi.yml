          application/json:
            schema:
              type: object
              properties:
                time_range:
                  type: object
                  properties:
                    begin:
                      type: string
                    end:
                      type: string
                  required:
                  - begin
                  - end
                search:
                  type: string
                queries:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                      operator:
                        type: string
                      value:
                        type: string
              required:
              - time_range
              - search
              - queries
            example:
              time_range:
                begin: '2023-11-14 10:55:38'
                end: '2023-11-14 11:55:38'
              search: ''
              queries:
              - field: staff_name
