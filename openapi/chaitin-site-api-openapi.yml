openapi: 3.0.3
info:
  title: APISec Management account site API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: site
paths:
  /open/site:
    get:
      produces:
      - application/json
      tags:
      - site
      summary: list web service
      parameters:
      - type: integer
        name: group_id
        in: query
        x-cli-description: 分组 ID
      - type: string
        name: site
        in: query
        x-cli-description: 站点域名
      - type: boolean
        name: sp_enabled
        in: query
        x-cli-description: 是否启用语义分析
      - type: boolean
        name: stat_enabled
        in: query
        x-cli-description: 是否启用统计
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.JSONBody'
            - type: object
              properties:
                data:
                  $ref: '#/definitions/site.GetWebsiteRes'
      x-cli-summary: 获取防护站点列表
    post:
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - site
      summary: create web service
      parameters:
      - description: request params
        name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/site.WebsiteReq'
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.JSONBody'
            - type: object
              properties:
                data:
                  type: integer
      x-cli-summary: 创建防护站点
    put:
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - site
      summary: update web service
      parameters:
      - description: request params
        name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/site.WebsiteReq'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/response.JSONBody'
      x-cli-summary: 更新防护站点
    delete:
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - site
      summary: delete web service
      parameters:
      - description: request params
        name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/site.DeleteWebsiteReq'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/response.JSONBody'
      x-cli-summary: 删除防护站点
