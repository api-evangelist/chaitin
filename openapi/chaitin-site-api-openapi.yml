openapi: 3.2.0
info:
  description: mgt API swagger document.
  title: mgt Site API
  contact: {}
  version: '2.0'
servers:
- url: /api
tags:
- name: Site
paths:
  /open/site:
    get:
      tags:
      - Site
      summary: list web service
      parameters:
      - name: group_id
        in: query
        x-cli-description: 分组 ID
        schema:
          type: integer
      - name: site
        in: query
        x-cli-description: 站点域名
        schema:
          type: string
      - name: sp_enabled
        in: query
        x-cli-description: 是否启用语义分析
        schema:
          type: boolean
      - name: stat_enabled
        in: query
        x-cli-description: 是否启用统计
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response.JSONBody'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/site.GetWebsiteRes'
      x-cli-summary: 获取防护站点列表
      operationId: getOpenSite
      x-operation-id-source: derived
    post:
      tags:
      - Site
      summary: create web service
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response.JSONBody'
                - type: object
                  properties:
                    data:
                      type: integer
      x-cli-summary: 创建防护站点
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/site.WebsiteReq'
        description: request params
        required: true
      operationId: postOpenSite
      x-operation-id-source: derived
    put:
      tags:
      - Site
      summary: update web service
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.JSONBody'
      x-cli-summary: 更新防护站点
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/site.WebsiteReq'
        description: request params
        required: true
      operationId: putOpenSite
      x-operation-id-source: derived
    delete:
      tags:
      - Site
      summary: delete web service
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.JSONBody'
      x-cli-summary: 删除防护站点
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/site.DeleteWebsiteReq'
        description: request params
        required: true
      operationId: deleteOpenSite
      x-operation-id-source: derived
components:
  schemas:
    site.WebsiteReq:
      type: object
      properties:
        cert_id:
          type: integer
        comment:
          type: string
        email:
          type: string
        group_id:
          type: integer
        health_check:
          type: boolean
        id:
          type: integer
        index:
          type: string
        load_balance:
          $ref: '#/components/schemas/model.LoadBalanceConfig'
        ports:
          type: array
          items:
            type: string
        redirect_status_code:
          type: integer
        server_names:
          type: array
          items:
            type: string
        stat_enabled:
          type: boolean
        static_default:
          type: integer
        type:
          type: integer
        upstreams:
          type: array
          items:
            type: string
    model.LoadBalanceConfig:
      type: object
      properties:
        balance_type:
          type: integer
    site.HealthState:
      type: object
      properties:
        error:
          type: string
        state:
          type: integer
    site.DeleteWebsiteReq:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
    response.JSONBody:
      type: object
      properties:
        data: {}
        err:
          type: string
        msg:
          type: string
    site.GetWebsiteRes:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/site.GetWebsiteItem'
        total:
          type: integer
    site.GetWebsiteItem:
      type: object
      properties:
        access_log_limit:
          type: integer
        acl_enabled:
          type: boolean
        acl_response_html_path:
          type: string
        acl_response_status_code:
          type: integer
        auth_defense_id:
          type: integer
        bad_gateway_html_path:
          type: string
        bad_gateway_status_code:
          type: integer
        cc_bot:
          type: boolean
        cert_filename:
          description: 3.5.0 存储时废弃，tcd通信时仍使用
          type: string
        cert_id:
          type: integer
        cert_type:
          description: '0 -> no cert, 1 -> upload, 2 -> self-signed, 3 -> choose mgt cert

            CertType 3.5.0 存储时废弃'
          type: integer
        challenge_id:
          type: integer
        chaos_id:
          type: integer
        chaos_is_enabled:
          type: boolean
        comment:
          type: string
        created_at:
          type: string
        custom_location:
          type: array
          items:
            type: string
        denied_value:
          type: integer
        email:
          type: string
        error_log_limit:
          type: integer
        exclude_content_type:
          type: array
          items:
            type: string
        exclude_paths:
          type: array
          items:
            type: string
        forbidden_html_path:
          type: string
        forbidden_status_code:
          type: integer
        forwarding_rules:
          description: ForwardingRules 转发规则配置（非数据库字段，用于传输到 tcd）
          type: array
          items:
            $ref: '#/components/schemas/model.ForwardingRuleConfig'
        gateway_timeout_html_path:
          type: string
        gateway_timeout_status_code:
          type: integer
        group_id:
          type: integer
        health_check:
          type: boolean
        health_state:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/site.HealthState'
        icon:
          type: string
        id:
          type: integer
        index:
          type: string
        init:
          type: boolean
        is_enabled:
          type: boolean
        key_filename:
          type: string
        load_balance:
          $ref: '#/components/schemas/model.LoadBalanceConfig'
        mode:
          description: 0 -> defense, 1-> offline, 2 -> dry run
          type: integer
        not_found_html_path:
          type: string
        not_found_status_code:
          type: integer
        offline_html_path:
          type: string
        offline_status_code:
          type: integer
        portal:
          type: boolean
        portal_redirect:
          type: string
        ports:
          type: array
          items:
            type: string
        position:
          type: integer
        redirect_status_code:
          type: integer
        req_value:
          type: integer
        semantics:
          type: boolean
        server_names:
          type: array
          items:
            type: string
        sp_enabled:
          description: 是否开启安全态势
          type: boolean
        stat_enabled:
          description: 是否开启统计
          type: boolean
        static:
          type: boolean
        static_default:
          type: integer
        tamper_refresh:
          description: 防篡改刷新时间（毫秒）
          type: integer
        tamper_refresh_state:
          type: string
        title:
          type: string
        type:
          type: integer
        updated_at:
          type: string
        upstreams:
          type: array
          items:
            type: string
        wr_id:
          type: integer
    model.ForwardingRuleConfig:
      type: object
      properties:
        id:
          type: integer
        path_prefix:
          type: string
        upstreams:
          type: array
          items:
            type: string
x-cli:
  tags:
    site: 防护站点管理
    cert: 授权与证书管理
    log: 日志查询
    stat: 数据统计
    skynet: 加强规则管理
    module: 语义分析模块配置
    rule: 自定义规则管理
    ipgroup: IP 黑白名单管理
  children:
    log/attack: 攻击日志
    log/audit: 审计日志
    log/rule: 黑白名单检测日志
    stat/trend: 趋势统计
  params:
    server_names: 域名（多个用逗号分隔）
    ports: 端口（多个用逗号分隔）
    upstreams: 后端地址（多个用逗号分隔）
    cert_id: 证书 ID
    comment: 备注说明
    email: 管理员邮箱
    group_id: 分组 ID
    health_check: 是否启用健康检查
    id: 资源 ID
    ids: 资源 ID（多个用逗号分隔）
    site: 站点域名
    sp_enabled: 是否启用语义分析
    stat_enabled: 是否启用统计
    load_balance: 负载均衡策略
    name: 规则名称
    pattern: 匹配规则（JSON 格式）
    action: 动作类型：0-放行 1-阻断 2-挑战 3-认证防护 4-混淆 5-等待室
    level: 风险等级
    enable: 是否启用
    mode: 模式：strict/default/dry_run/disable/deny
    semantics: 语义分析配置
    use_global: 是否使用全局配置
    ips: IP 地址（多个用逗号分隔）
    ip_group_ids: IP Group ID（多个用逗号分隔）
    page: 页码
    page_size: 每页数量
    size: 每页数量
    start: 开始时间戳（秒）
    end: 结束时间戳（秒）
    begin_time: 开始时间戳（秒）
    end_time: 结束时间戳（秒）
    site_id: 站点 ID
    host: 域名
    ip: IP 地址
    url: URL 路径
    port: 端口
    attack_type: 攻击类型
    event_id: 事件 ID
    ja4_fingerprint: JA4 指纹
    top: 返回前 N 条
    reference: 引用来源
    expire: 过期时间
    log: 是否记录日志
    is_enabled: 是否启用
    global: 是否全局
