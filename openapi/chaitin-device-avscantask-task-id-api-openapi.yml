openapi: 3.0.3
info:
  title: APISec Management account device/avscantask/{task_id} API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: device/avscantask/{task_id}
  description: 终端管理/杀毒扫描任务/task_id 参数
paths:
  /device/avscantask/{task_id}:
    post:
      summary: 任务编辑
      deprecated: false
      description: ''
      tags:
      - device/avscantask/{task_id}
      parameters:
      - name: task_id
        in: path
        description: ''
        required: true
        example: 0fee6bc9-9b7c-4cf2-b282-387f5a222ebb
        schema:
          type: string
      - name: X-CS-Header-App
        in: header
        description: 应用id
        required: true
        example: '{{app}}'
        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                frequency_options:
                  type: object
                  properties:
                    effect_type:
                      type: string
                    period_category:
                      type: string
                    period_options:
                      type: object
                      properties:
                        day:
                          type: 'null'
                        hour:
                          type: integer
                        minute:
                          type: integer
                        weekday:
                          type: integer
                      required:
                      - day
                      - hour
                      - minute
                      - weekday
                  required:
                  - effect_type
                  - period_category
                  - period_options
                scope:
                  type: string
                exclude:
                  type: array
                  items: {}
                file_scan_mode:
                  type: string
                advanced_option:
                  type: boolean
                action:
                  type: string
                include:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      type:
                        type: string
                file_type_included:
                  type: array
                  items:
                    type: string
                file_size_lower:
                  type: integer
                file_size_upper:
                  type: integer
                file_size_lower_measure:
                  type: string
                file_size_upper_measure:
                  type: string
                binding_config:
                  type: object
                  properties:
                    source:
                      type: string
                    include:
                      type: object
                      properties:
                        device_ids:
                          type: array
                          items:
                            type: string
                      required:
                      - device_ids
                    exclude:
                      type: object
                      properties: {}
                  required:
                  - source
                  - include
                  - exclude
                name:
                  type: string
                frequency:
                  type: string
                scan_mode:
                  type: string
              required:
              - frequency_options
              - scope
              - exclude
              - file_scan_mode
              - advanced_option
              - action
              - include
              - file_type_included
              - file_size_lower
              - file_size_upper
              - file_size_lower_measure
              - file_size_upper_measure
              - binding_config
              - name
              - frequency
              - scan_mode
            example:
              frequency_options:
                effect_type: immediately
                period_category: week
                period_options:
                  day: null
                  hour: 18
                  minute: 2
                  weekday: 6
              scope: common
              exclude: []
              file_scan_mode: speed
              advanced_option: true
              action: notify
              include:
              - id: da9ea823-3b0b-4d9f-a745-2aad58e0af89
                name: PC-000009
                type: device
              file_type_included:
              - high
              - text
              - compressed
              - low
              file_size_lower: 0
              file_size_upper: 1
              file_size_lower_measure: MB
              file_size_upper_measure: MB
              binding_config:
                source: av_scan
                include:
                  device_ids:
                  - da9ea823-3b0b-4d9f-a745-2aad58e0af89
                exclude: {}
              name: 默认全盘查杀任务
              frequency: cycle
              scan_mode: quick
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example: {}
      security: []
