openapi: 3.0.3
info:
  title: APISec Management account installer/task API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: installer/task
  description: 终端安装包/任务
paths:
  /installer/task/:
    post:
      summary: 发布版本并创建任务
      deprecated: false
      description: ''
      tags:
      - installer/task
      parameters:
      - name: X-CS-Header-App
        in: header
        description: 应用id
        required: true
        example: '{{app}}'
        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                installer_id:
                  type: string
                release_strategy:
                  type: string
                period_category:
                  type: string
                period_options:
                  type: object
                  properties:
                    period_hours_value:
                      type: array
                      items:
                        type: object
                        properties:
                          begin:
                            type: string
                          end:
                            type: string
                          week:
                            type: integer
                        required:
                        - begin
                        - end
                        - week
                  required:
                  - period_hours_value
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      scope:
                        type: string
                      step_category:
                        type: string
                      delay_options:
                        type: object
                        properties:
                          measure:
                            type: string
                          value:
                            type: integer
                          enabled:
                            type: boolean
                        required:
                        - measure
                        - value
                        - enabled
                      include:
                        type: object
                        properties: {}
                      exclude:
                        type: object
                        properties: {}
                    required:
                    - scope
                    - step_category
                    - delay_options
                    - include
                    - exclude
              required:
              - name
              - installer_id
              - release_strategy
              - period_category
              - period_options
              - steps
            example:
              name: 全量发布1
              installer_id: 07ec5f03-86e9-40fc-91fb-4994da0631ce
              release_strategy: entity
              period_category: permanent
              period_options:
                period_hours_value:
                - begin: 00:00
                  end: '23:59'
                  week: 1
                - begin: 00:00
                  end: '23:59'
                  week: 2
              steps:
              - scope: common
                step_category: manual
                delay_options:
                  measure: hour
                  value: 10
                  enabled: true
                include: {}
                exclude: {}
              - scope: common
                step_category: manual
                delay_options:
                  measure: hour
                  value: 10
                  enabled: true
                include: {}
                exclude: {}
              - scope: common
                step_category: manual
                delay_options:
                  measure: hour
                  value: 10
                  enabled: true
                include: {}
                exclude: {}
              - scope: global
                step_category: manual
                delay_options:
                  measure: hour
                  value: 10
                  enabled: true
                include: {}
                exclude: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example: {}
      security: []
