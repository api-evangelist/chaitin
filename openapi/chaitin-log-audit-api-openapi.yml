openapi: 3.2.0
info:
  description: mgt API swagger document.
  title: mgt Log/audit API
  contact: {}
  version: '2.0'
servers:
- url: /api
tags:
- name: log/audit
paths:
  /business/audit_log:
    get:
      tags:
      - log/audit
      summary: get audit logs
      parameters:
      - name: page
        in: query
        x-cli-description: 页码
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        x-cli-description: 每页数量
        schema:
          type: integer
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response.JSONBody'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/audit_log.ListAuditLogRes'
      x-cli-summary: 查看审计日志列表
      operationId: getBusinessAuditLog
      x-operation-id-source: derived
components:
  schemas:
    response.JSONBody:
      type: object
      properties:
        data: {}
        err:
          type: string
        msg:
          type: string
    audit_log.ListAuditLogItem:
      type: object
      properties:
        content:
          type: string
        created_at:
          type: integer
        id:
          type: integer
        ip:
          type: string
        username:
          type: string
    audit_log.ListAuditLogRes:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/audit_log.ListAuditLogItem'
        total:
          type: integer
x-cli:
  tags:
    site: 防护站点管理
    cert: 授权与证书管理
    log: 日志查询
    stat: 数据统计
    skynet: 加强规则管理
    module: 语义分析模块配置
    rule: 自定义规则管理
    ipgroup: IP 黑白名单管理
  children:
    log/attack: 攻击日志
    log/audit: 审计日志
    log/rule: 黑白名单检测日志
    stat/trend: 趋势统计
  params:
    server_names: 域名（多个用逗号分隔）
    ports: 端口（多个用逗号分隔）
    upstreams: 后端地址（多个用逗号分隔）
    cert_id: 证书 ID
    comment: 备注说明
    email: 管理员邮箱
    group_id: 分组 ID
    health_check: 是否启用健康检查
    id: 资源 ID
    ids: 资源 ID（多个用逗号分隔）
    site: 站点域名
    sp_enabled: 是否启用语义分析
    stat_enabled: 是否启用统计
    load_balance: 负载均衡策略
    name: 规则名称
    pattern: 匹配规则（JSON 格式）
    action: 动作类型：0-放行 1-阻断 2-挑战 3-认证防护 4-混淆 5-等待室
    level: 风险等级
    enable: 是否启用
    mode: 模式：strict/default/dry_run/disable/deny
    semantics: 语义分析配置
    use_global: 是否使用全局配置
    ips: IP 地址（多个用逗号分隔）
    ip_group_ids: IP Group ID（多个用逗号分隔）
    page: 页码
    page_size: 每页数量
    size: 每页数量
    start: 开始时间戳（秒）
    end: 结束时间戳（秒）
    begin_time: 开始时间戳（秒）
    end_time: 结束时间戳（秒）
    site_id: 站点 ID
    host: 域名
    ip: IP 地址
    url: URL 路径
    port: 端口
    attack_type: 攻击类型
    event_id: 事件 ID
    ja4_fingerprint: JA4 指纹
    top: 返回前 N 条
    reference: 引用来源
    expire: 过期时间
    log: 是否记录日志
    is_enabled: 是否启用
    global: 是否全局
