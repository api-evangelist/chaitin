            schema:
              type: object
              properties:
                pattern:
                  type: object
                  description: 匹配条件
                percentage:
                  type: integer
                  description: 触发概率
                action:
                  type: string
                  description: 动作
                risk_level:
                  type: string
                  description: 危险等级
                attack_type:
                  type: string
                  description: 攻击类型
                delay:
                  type: integer
                  description: 延迟处理
