openapi: 3.0.3
info:
  title: APISec Management account policy API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: policy
paths:
  /api/PolicyRuleAPI:
    post:
      operationId: PolicyRuleAPI_post
      summary: POST /api/PolicyRuleAPI
      tags:
      - policy
      parameters: []
      x-cli-body-fallback: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pattern:
                  type: object
                  description: 匹配条件
                percentage:
                  type: integer
                  description: 触发概率
                action:
                  type: string
                  description: 动作
                risk_level:
                  type: string
                  description: 危险等级
                attack_type:
                  type: string
                  description: 攻击类型
                delay:
                  type: integer
                  description: 延迟处理
                log_option:
                  type: string
                  description: 日志记录设置
                forbidden_page_config:
                  type: string
                  description: null 代表不指定，使用继承的配置；规则无法设置拦截页面
                is_enabled:
                  type: boolean
                  description: 是否可用
                comment:
                  type: string
                  description: 备注
                expire_time:
                  type: string
                  description: 过期时间
                is_global:
                  type: boolean
                  description: 是否是全局策略
                sites:
                  type: object
                  description: 站点
                cron_config:
                  type: string
                  description: 定时方式配置
              required:
              - pattern
              - percentage
              - action
              - risk_level
              - attack_type
              - delay
              - log_option
              - forbidden_page_config
              - is_enabled
              - comment
              - expire_time
              - is_global
              - sites
    put:
