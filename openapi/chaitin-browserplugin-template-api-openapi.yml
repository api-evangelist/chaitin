openapi: 3.0.3
info:
  title: APISec Management account browserplugin/template API
  version: '26.05'
  description: Generated from APISec skyview APIView classes.
tags:
- name: browserplugin/template
  description: 浏览器插件/模板
paths:
  /browserplugin/template:
    post:
      summary: 插件源模版下载
      deprecated: false
      description: ''
      tags:
      - browserplugin/template
      parameters:
      - name: X-CS-Header-App
        in: header
        description: 应用id
        required: true
        example: '{{app}}'
        schema:
          type: string
      - name: X-CS-Header-Company
        in: header
        description: 公司id
        required: true
        example: '{{company_id}}'
        schema:
          type: string
      - name: X-CS-Header-Crypt
        in: header
        description: 加密算法，请参考：https://servaltech.feishu.cn/docs/doccnQCZ2cw32uazgNSO0DFwceb
        required: true
        example: ''
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: 对于支持「ETAG」的接口，将上一次请求的响应header的Etag，填入到下一次请求。若匹配，则返回304（无变更），否则会返回新版本的数据 + 新Etag
        required: true
        example: string
        schema:
          type: string
      - name: X-CS-Header-Debug
        in: header
        description: ''
        required: true
        example: '{{debug}}'
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: true
        example: zh
        schema:
          type: string
      - name: X-Cs-Header-Timezone
        in: header
        description: ''
        required: true
        example: Asia/Shanghai
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      etag:
                        type: string
                      relative_path:
                        type: string
                      last_modified:
                        type: string
                      size:
                        type: integer
                      content_type:
                        type: string
                      filename:
                        type: string
                      url:
                        type: string
                      file_system:
                        type: string
                      url_path:
                        type: string
                    required:
                    - etag
                    - relative_path
                    - last_modified
                    - size
                    - content_type
                    - filename
                    - url
                    - file_system
                    - url_path
                required:
                - code
                - msg
                - data
              example:
                code: 0
                msg: 正常
                data:
                  etag: 5d8d7194b5950081a30d2e6b9d7604c9
