aid: chaitin
name: Chaitin Tech
description: >-
  Chaitin Tech (长亭科技) is a Chinese cybersecurity company best known for
  SafeLine (雷池), a self-hosted, semantic-analysis Web Application Firewall and
  reverse proxy with 22k+ GitHub stars. Its broader security portfolio spans web
  application firewalling, vulnerability and risk assessment (X-Ray), automated
  penetration testing, asset exposure management (Cloud Atlas), container
  security (VeinMind), host workload protection (CloudWalker), API security
  (APISec), threat deception (D-Sensor), traffic threat detection (T-Answer),
  static application security testing (CodeInsight), and AI security tooling.
  Chaitin products expose machine APIs authenticated with a per-instance API
  token header (SafeLine uses X-SLCE-API-TOKEN on port 9443, /api/open/*) and are
  managed through a unified command-line tool, chaitin-cli, which also ships as
  an installable agent skill. Chaitin is backed by Qiming Venture Partners.
